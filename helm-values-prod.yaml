projectName: sparrowx
environment: prod

serviceName: notification-api

replicaCount: 1

appPort: 8000
# extraAnnotations:
# extraLabels:

resources:
  size: medium


database:
  enabled: true
  name: notificationdb
  engine: postgres
  port: 5432
  host: notificationdb-postgres.prod.sparrowx.internal


servicemonitor:
  enabled: true

probePath: /health
livenessProbe:
  enabled: true
readinessProbe:
  enabled: true
startupProbe:
  enabled: true